name: Verify CI/CD Environment Secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  verify-secrets:
    name: Check Repository Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Diagnostic Secret Audit
        run: |
          echo "=========================================="
          echo "  BOULT AI Suite - Secret Audit Diagnostic"
          echo "=========================================="

          check_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "  [OK] $name : Configured (${#value} chars)"
            else
              echo "  [WARNING] $name : MISSING or EMPTY"
            fi
          }

          check_secret "GEMINI_API_KEY" "$GEMINI_API_KEY"
          check_secret "REPLICATE_API_TOKEN" "$REPLICATE_API_TOKEN"
          check_secret "TAURI_PRIVATE_KEY" "$TAURI_PRIVATE_KEY"
          check_secret "TAURI_KEY_PASSWORD" "$TAURI_KEY_PASSWORD"
          check_secret "NPM_TOKEN" "$NPM_TOKEN"
          check_secret "GITHUB_TOKEN" "$GITHUB_TOKEN"

          echo "=========================================="
          echo "Diagnostic complete. Raw secrets are redacted by GitHub Actions."
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
