name: BOULT AI Suite Automated Multi-OS Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-desktop:
    name: Build Desktop Binary (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: Linux AppImage & Deb
          - os: macos-latest
            platform: macos
            artifact_name: macOS DMG
          - os: windows-latest
            platform: windows
            artifact_name: Windows Executable

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application Bundle
        run: npm run build

      - name: Compile Desktop App (Tauri v2)
        shell: bash
        run: |
          chmod +x ./scripts/build-desktop.sh
          ./scripts/build-desktop.sh

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boult-suite-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/

  release-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Android APK
        run: |
          chmod +x ./scripts/build-android.sh
          ./scripts/build-android.sh

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boult-suite-android-apk
          path: android/app/build/outputs/apk/release/*.apk
